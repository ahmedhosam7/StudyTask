
name: Build StudyTask APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: android-capacitor
        run: npm install

      - name: Add Android platform
        working-directory: android-capacitor
        run: npx cap add android

      - name: Sync Android
        working-directory: android-capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android-capacitor/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTask-APK
          path: android-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
