name: Build StudyTask APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      -       - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: cd android-capacitor && npm install
      - run: cd android-capacitor && npx cap add android
      - run: cd android-capacitor && npx cap sync android
      - run: cd android-capacitor/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StudyTask-APK
          path: android-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
